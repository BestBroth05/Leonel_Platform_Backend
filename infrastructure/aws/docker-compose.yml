# Leonel Platform — API + Postgres on shared EC2 (PathBus host).
# Does NOT touch SQL Server or the existing PathBus service on :3000.
#
# Usage (on server):
#   cd /opt/leonel-platform
#   cp .env.example .env   # fill secrets
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leonel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-leonel_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - leonel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-leonel_platform} -d ${POSTGRES_DB:-leonel_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No host ports: only reachable on the compose network.
    networks:
      - leonel

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEONEL_PLATFORM_ENV: ${LEONEL_PLATFORM_ENV:-production}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-leonel_platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leonel_platform}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://bestbroth05.github.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leonel-platform.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    ports:
      # Bind to loopback only — nginx proxies https://api-test.path-bus.com/leonel/
      - "127.0.0.1:3001:3000"
    networks:
      - leonel

volumes:
  leonel_pg_data:

networks:
  leonel:
    driver: bridge
