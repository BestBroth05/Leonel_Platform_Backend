name: deploy-aws

# Deploy Leonel API to PathBus EC2 after CI on develop.
# Requires secrets: AWS_EC2_HOST, AWS_EC2_USER, AWS_EC2_SSH_KEY
# Optional: AWS_EC2_PATH (default /opt/leonel-platform)
#
# Keep deploy-render.yml until AWS cutover is validated.

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leonel_platform
          POSTGRES_USER: leonel_platform
          POSTGRES_PASSWORD: leonel_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leonel_platform -d leonel_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://leonel_platform:leonel_platform_ci@localhost:5432/leonel_platform
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      LEONEL_PLATFORM_ENV: ci
      ADMIN_EMAIL: admin@leonel-platform.local
      ADMIN_PASSWORD: Pass123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @leonel-platform/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate + seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build API
        run: pnpm --filter @leonel-platform/api build

  deploy:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
          AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          AWS_EC2_PATH: ${{ secrets.AWS_EC2_PATH }}
        run: |
          if [ -z "$AWS_EC2_HOST" ] || [ -z "$AWS_EC2_USER" ] || [ -z "$AWS_EC2_SSH_KEY" ]; then
            echo "Missing AWS_EC2_HOST / AWS_EC2_USER / AWS_EC2_SSH_KEY secrets."
            echo "Skipping remote deploy (CI already passed)."
            exit 0
          fi
          PATH_REMOTE="${AWS_EC2_PATH:-/opt/leonel-platform}"
          install -m 600 /dev/null /tmp/leonel_deploy_key
          printf '%s\n' "$AWS_EC2_SSH_KEY" > /tmp/leonel_deploy_key
          ssh -i /tmp/leonel_deploy_key -o StrictHostKeyChecking=yes \
            "${AWS_EC2_USER}@${AWS_EC2_HOST}" \
            "set -euo pipefail
             cd '${PATH_REMOTE}'
             git fetch origin
             git checkout develop
             git pull --ff-only origin develop
             docker compose -f infrastructure/aws/docker-compose.yml --env-file infrastructure/aws/.env up -d --build
             curl -fsS http://127.0.0.1:3001/health
            "
