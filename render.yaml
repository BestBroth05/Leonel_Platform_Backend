# Render Blueprint — Leonel Platform API
# Docs: https://render.com/docs/blueprint-spec
#
# En Render: New → Blueprint → conectar este repo (rama develop).
# Crea Web Service + Postgres.

services:
  - type: web
    name: leonel-platform-api
    runtime: docker
    plan: free
    branch: develop
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEONEL_PLATFORM_ENV
        value: render
      - key: LEONEL_PLATFORM_LOG_LEVEL
        value: info
      - key: SEED_ON_BOOT
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: ADMIN_EMAIL
        value: admin@leonel-platform.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: leonel-platform-db
          property: connectionString

databases:
  - name: leonel-platform-db
    plan: free
    databaseName: leonel_platform
    user: leonel_platform
